<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Test Page</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .download-section { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; }
        a.download-link { display: inline-block; padding: 8px 16px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; margin: 4px; }
        a.download-link:hover { background: #0052a3; }
        button.download-btn { padding: 8px 16px; cursor: pointer; margin: 4px; }
        #download-status { margin-top: 20px; padding: 10px; background: #eee; }
    </style>
</head>
<body>
    <h1>Download Test Page</h1>

    <!-- Data URI downloads -->
    <div class="download-section">
        <h2>Data URI Downloads</h2>
        <a id="download-text" class="download-link"
            href="data:text/plain;charset=utf-8,Hello%20World!%0AThis%20is%20a%20test%20file."
            download="test.txt">
            Download Text File
        </a>
        <a id="download-csv" class="download-link"
            href="data:text/csv;charset=utf-8,Name,Age,City%0AAlice,30,NYC%0ABob,25,LA"
            download="data.csv">
            Download CSV
        </a>
        <a id="download-json" class="download-link"
            href="data:application/json;charset=utf-8,%7B%22name%22%3A%22test%22%2C%22value%22%3A42%7D"
            download="data.json">
            Download JSON
        </a>
        <a id="download-html" class="download-link"
            href="data:text/html;charset=utf-8,%3Chtml%3E%3Cbody%3E%3Ch1%3EHello%3C/h1%3E%3C/body%3E%3C/html%3E"
            download="page.html">
            Download HTML
        </a>
    </div>

    <!-- Blob downloads (generated via JS) -->
    <div class="download-section">
        <h2>Generated Downloads</h2>
        <button id="generate-blob-btn" class="download-btn" onclick="generateBlobDownload()">
            Generate &amp; Download Blob
        </button>
        <button id="generate-large-btn" class="download-btn" onclick="generateLargeDownload()">
            Generate Large File (1KB)
        </button>
        <button id="generate-binary-btn" class="download-btn" onclick="generateBinaryDownload()">
            Generate Binary File
        </button>
    </div>

    <!-- Link-based download with target -->
    <div class="download-section">
        <h2>Link Downloads</h2>
        <a id="download-new-tab" class="download-link" href="data:text/plain,Download%20in%20new%20tab"
            download="newtab.txt" target="_blank">
            Download in New Tab
        </a>
        <a id="no-download-attr" class="download-link" href="data:text/plain,No%20download%20attribute">
            Link Without Download Attr
        </a>
    </div>

    <div id="download-status">No downloads yet</div>

    <script>
        var downloadCount = 0;

        function updateStatus(msg) {
            downloadCount++;
            document.getElementById('download-status').textContent =
                'Download #' + downloadCount + ': ' + msg;
        }

        function generateBlobDownload() {
            var content = 'This file was generated by JavaScript.\nTimestamp: ' + new Date().toISOString();
            var blob = new Blob([content], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'generated.txt';
            a.click();
            URL.revokeObjectURL(url);
            updateStatus('Blob text file generated');
        }

        function generateLargeDownload() {
            var lines = [];
            for (var i = 0; i < 50; i++) {
                lines.push('Line ' + (i + 1) + ': ' + 'x'.repeat(20));
            }
            var content = lines.join('\n');
            var blob = new Blob([content], { type: 'text/plain' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'large-file.txt';
            a.click();
            URL.revokeObjectURL(url);
            updateStatus('Large file generated (' + content.length + ' bytes)');
        }

        function generateBinaryDownload() {
            var bytes = new Uint8Array(256);
            for (var i = 0; i < 256; i++) {
                bytes[i] = i;
            }
            var blob = new Blob([bytes], { type: 'application/octet-stream' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'binary.bin';
            a.click();
            URL.revokeObjectURL(url);
            updateStatus('Binary file generated (256 bytes)');
        }

        // Track clicks on download links
        document.querySelectorAll('.download-link').forEach(function(link) {
            link.addEventListener('click', function() {
                updateStatus('Clicked: ' + this.textContent.trim());
            });
        });
    </script>
</body>
</html>
